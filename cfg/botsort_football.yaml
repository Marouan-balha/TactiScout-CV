# BoT-SORT tracker - fast config (no ReID)
tracker_type: botsort
track_high_thresh: 0.2
track_low_thresh: 0.05
new_track_thresh: 0.2
track_buffer: 150
match_thresh: 0.7
fuse_score: True

# Camera motion compensation (lightweight)
gmc_method: sparseOptFlow

# ReID OFF - too slow on CPU
proximity_thresh: 0.5
appearance_thresh: 0.3
with_reid: False
model: auto
